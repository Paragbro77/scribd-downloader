services:
  - type: web
    runtime: python
    name: scribd-manifest-relay
    plan: free
    buildCommand: pip install -r relay/requirements.txt
    startCommand: gunicorn --chdir relay app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: SCRIBD_ACCESS_KEY
        sync: false
