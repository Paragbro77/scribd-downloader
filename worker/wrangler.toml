name = "scribd-queue"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "e532a595bf8bef8581d6562d2e2cf61c"

[assets]
directory = "../frontend"

[vars]
# Live URL of this same worker (workers.dev subdomain of the owning account).
ALLOWED_ORIGIN = "https://scribd-queue.ytvideo.workers.dev"
# Residential manifest relay: intentionally NOT configured. No personal
# machines / residential IPs are used — instant export answers 503 with
# fallback:'queue' until a hosted (non-personal) relay exists.
MANIFEST_RELAY = ""

[[d1_databases]]
binding = "DB"
database_name = "scribd-queue"
database_id = "80fb7c3a-c926-4122-9baa-04df67b581e9"

