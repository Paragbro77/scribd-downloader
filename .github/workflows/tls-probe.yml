name: tls-probe
on:
  workflow_dispatch:
    inputs:
      doc_id:
        description: "Scribd document id to probe"
        default: "558718376"
        required: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q curl_cffi==0.11.0 requests==2.32.3
      - name: Fetch embed HTML with chrome124 TLS from GH datacenter IP
        env:
          SCRIBD_ACCESS_KEY: ${{ secrets.SCRIBD_ACCESS_KEY }}
          DOC_ID: ${{ inputs.doc_id }}
        run: |
          python - <<'EOF'
          import os
          import re
          from curl_cffi import requests as cr
          DOC = os.environ.get("DOC_ID") or "558718376"
          KEY = os.environ.get("SCRIBD_ACCESS_KEY", "")
          if not KEY:
              raise SystemExit("SCRIBD_ACCESS_KEY secret is not set")
          EMBED = (f"https://www.scribd.com/embeds/{DOC}/content?start_page=1"
                   f"&view_mode=scroll&access_key={KEY}")
          for imp in ("chrome124", "chrome131", "safari18_0"):
              try:
                  s = cr.Session(impersonate=imp)
                  r = s.get(EMBED, timeout=45, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Referer": "https://www.scribd.com/"})
                  t = r.text
                  adds = len(re.findall(r"contentUrl:", t))
                  print(f"{imp}: status={r.status_code} len={len(t)} addPage={t.count('docManager.addPage')} contentUrls={adds} challenged={'Client Challenge' in t}")
              except Exception as e:
                  print(f"{imp}: ERROR {str(e)[:250]}")
          EOF
      - name: CDN image + jsonp from datacenter IP
        run: |
          python - <<'EOF'
          import requests
          H = {"User-Agent": "Mozilla/5.0",
               "Referer": "https://www.scribd.com/",
               "Origin": "https://scribd-queue.akatwdao.workers.dev"}
          for label, url in (
              ("image", "https://html.scribdassets.com/1p4o42l6yo9j5v1j/images/1-b6a1c638fa.jpg"),
              ("jsonp", "https://html.scribdassets.com/1p4o42l6yo9j5v1j/pages/4-52a0ee882a.jsonp"),
          ):
              try:
                  r = requests.get(url, timeout=45, headers=H)
                  print(f"{label}: status={r.status_code} len={len(r.content)} "
                        f"ACAO={r.headers.get('access-control-allow-origin')} "
                        f"ctype={r.headers.get('content-type')}")
              except Exception as e:
                  print(f"{label}: ERROR {str(e)[:250]}")
          EOF
      - name: Plain requests embed baseline (datacenter IP)
        env:
          SCRIBD_ACCESS_KEY: ${{ secrets.SCRIBD_ACCESS_KEY }}
          DOC_ID: ${{ inputs.doc_id }}
        run: |
          python - <<'EOF'
          import os
          import requests
          DOC = os.environ.get("DOC_ID") or "558718376"
          KEY = os.environ.get("SCRIBD_ACCESS_KEY", "")
          EMBED = (f"https://www.scribd.com/embeds/{DOC}/content?start_page=1"
                   f"&view_mode=scroll&access_key={KEY}")
          r = requests.get(EMBED, timeout=45, headers={"User-Agent": "Mozilla/5.0"})
          print(f"plain: status={r.status_code} len={len(r.content)} challenged={'Client Challenge' in r.text}")
          EOF
      - name: CDN cookie/param probe (does the CDN gate on session?)
        run: |
          python - <<'EOF'
          import requests
          H = {"User-Agent": "Mozilla/5.0",
               "Referer": "https://www.scribd.com/",
               "Origin": "https://scribd-queue.akatwdao.workers.dev"}
          IMG = "https://html.scribdassets.com/1p4o42l6yo9j5v1j/images/1-b6a1c638fa.jpg"
          s = requests.Session()
          r1 = s.get(IMG, timeout=45, headers=H)
          print(f"cdn-plain: status={r1.status_code} len={len(r1.content)} "
                f"ACAO={r1.headers.get('access-control-allow-origin')} "
                f"ctype={r1.headers.get('content-type')} cookies={dict(s.cookies)}")
          # same URL on a FRESH session (no cookies carried)
          r2 = requests.get(IMG, timeout=45, headers=H)
          print(f"cdn-fresh: status={r2.status_code} len={len(r2.content)} "
                f"ACAO={r2.headers.get('access-control-allow-origin')} "
                f"ctype={r2.headers.get('content-type')}")
          # jsonp fresh vs session
          J = "https://html.scribdassets.com/1p4o42l6yo9j5v1j/pages/4-52a0ee882a.jsonp"
          r3 = s.get(J, timeout=45, headers=H)
          print(f"jsonp-session: status={r3.status_code} len={len(r3.content)} "
                f"ACAO={r3.headers.get('access-control-allow-origin')}")
          r4 = requests.get(J, timeout=45, headers=H)
          print(f"jsonp-fresh: status={r4.status_code} len={len(r4.content)} "
                f"ACAO={r4.headers.get('access-control-allow-origin')}")
          EOF
