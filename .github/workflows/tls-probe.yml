name: tls-probe
on:
  workflow_dispatch:
    inputs:
      doc_id:
        description: "Scribd document id to probe"
        default: "558718376"
        required: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q curl_cffi==0.11.0
      - name: Fetch embed HTML with chrome124 TLS from GH datacenter IP
        env:
          SCRIBD_ACCESS_KEY: ${{ secrets.SCRIBD_ACCESS_KEY }}
          DOC_ID: ${{ inputs.doc_id }}
        run: |
          python - <<'EOF'
          import os
          import re
          from curl_cffi import requests as cr
          DOC = os.environ.get("DOC_ID") or "558718376"
          KEY = os.environ.get("SCRIBD_ACCESS_KEY", "")
          if not KEY:
              raise SystemExit("SCRIBD_ACCESS_KEY secret is not set")
          EMBED = (f"https://www.scribd.com/embeds/{DOC}/content?start_page=1"
                   f"&view_mode=scroll&access_key={KEY}")
          for imp in ("chrome124", "chrome131", "safari18_0"):
              try:
                  s = cr.Session(impersonate=imp)
                  r = s.get(EMBED, timeout=45, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Referer": "https://www.scribd.com/"})
                  t = r.text
                  adds = len(re.findall(r"contentUrl:", t))
                  print(f"{imp}: status={r.status_code} len={len(t)} addPage={t.count('docManager.addPage')} contentUrls={adds} challenged={'Client Challenge' in t}")
              except Exception as e:
                  print(f"{imp}: ERROR {str(e)[:250]}")
          EOF
      - name: Also try plain requests (baseline)
        env:
          SCRIBD_ACCESS_KEY: ${{ secrets.SCRIBD_ACCESS_KEY }}
          DOC_ID: ${{ inputs.doc_id }}
        run: |
          python - <<'EOF'
          import os
          import requests
          DOC = os.environ.get("DOC_ID") or "558718376"
          KEY = os.environ.get("SCRIBD_ACCESS_KEY", "")
          EMBED = (f"https://www.scribd.com/embeds/{DOC}/content?start_page=1"
                   f"&view_mode=scroll&access_key={KEY}")
          r = requests.get(EMBED, timeout=45, headers={"User-Agent": "Mozilla/5.0"})
          print(f"plain: status={r.status_code} len={len(r.content)} challenged={'Client Challenge' in r.text}")
          EOF
