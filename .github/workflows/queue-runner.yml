name: queue-runner
on:
  workflow_dispatch:
    inputs:
      reason:
        description: reason
        default: heal
  schedule:
    - cron: "*/15 * * * *"
concurrency:
  group: queue-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r runner/requirements-runner.txt
      - name: Install obscura
        run: |
          curl -fsSL -o obscura https://github.com/obscura-headless/obscura/releases/latest/download/obscura-linux-x64
          chmod +x obscura
          ./obscura serve --port 9222 --stealth &
          sleep 3
      - name: Drain queue
        env:
          API_BASE: "${{ secrets.WORKER_API_BASE }}"
          CALLBACK_SECRET: "${{ secrets.CALLBACK_SECRET }}"
        run: python runner/queue_worker.py --api "$API_BASE" --secret "$CALLBACK_SECRET" --deadline-min 340
      - name: Chain next run
        if: always()
        env:
          GH_PAT: "${{ secrets.GH_PAT }}"
        run: |
          LEFT=$(curl -fsS -H "Authorization: Bearer ${{ secrets.CALLBACK_SECRET }}" "${{ secrets.WORKER_API_BASE }}/api/internal/pending-count" || echo 1)
          if [ "$LEFT" != "0" ]; then curl -fsS -X POST -H "Authorization: Bearer $GH_PAT" -H Accept:application/vnd.github+json https://api.github.com/repos/${{ github.repository }}/actions/workflows/queue-runner.yml/dispatches -d '{"ref":"main"}'; fi
